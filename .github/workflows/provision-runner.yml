name: Provision runner (manual)

# 一次性运维作业：给自托管 runner 补齐 PX4 SITL 环境。
# 只有 workflow_dispatch 一个入口，且只在本仓库触发 —— 任何 PR 都不会调用它。
# 每一步都先检查再动手，缺什么报什么，不做静默回退。

on:
  workflow_dispatch:
    inputs:
      action:
        description: "执行哪种操作"
        type: choice
        options: [check, python-deps, clone-px4, build-sitl]
        default: check
      px4_root:
        description: "PX4 树目标路径（留空 = $HOME/drone-simulation）"
        default: ""
      px4_repo:
        description: "PX4 仓库地址"
        default: https://github.com/pawn-queen/drone-simulation.git
      parallel:
        description: "编译并行度"
        default: "12"

permissions:
  contents: read

jobs:
  provision:
    name: Provision (${{ inputs.action }})
    if: github.repository == 'pawn-queen/px4_ros_ws'
    runs-on: [self-hosted, sim-heavy]
    timeout-minutes: 120
    env:
      PX4_ROOT: ${{ inputs.px4_root }}
      PX4_REPO: ${{ inputs.px4_repo }}
      PARALLEL: ${{ inputs.parallel }}
    steps:
      - name: Preflight (path / disk / sudo)
        run: |
          set -uo pipefail
          if [ -z "${PX4_ROOT:-}" ]; then
            PX4_ROOT="$HOME/drone-simulation"
            echo "PX4_ROOT=$PX4_ROOT" >> "$GITHUB_ENV"
          fi
          echo "host=$(hostname)"
          echo "user=$(id -un) ($(id -u):$(id -g))"
          echo "root=$PX4_ROOT"
          probe="$PX4_ROOT"
          while [ ! -d "$probe" ]; do probe="$(dirname "$probe")"; done
          echo "disk probe=$probe"
          df -h "$probe" | tail -1
          # runner 用户没有免密 sudo。不为自动化去申请 root：改为全部装在
          # $HOME 下，只在 build-sitl 里尝试、失败就明确报告缺什么。
          if sudo -n true 2>/dev/null; then
            echo "sudo: passwordless OK"
          else
            echo "sudo: NOT available (build-sitl will skip system package install)"
          fi

      - name: Report state
        if: inputs.action == 'check'
        run: |
          set -uo pipefail
          {
            echo "### Provision check"
            echo ""
            echo "- px4_root: $( [ -d "$PX4_ROOT" ] && echo present || echo MISSING )"
            echo "- px4_bin: $( [ -x "$PX4_ROOT/build/px4_sitl_default/bin/px4" ] && echo present || echo MISSING )"
            __probe="$PX4_ROOT"; while [ ! -d "$__probe" ]; do __probe="$(dirname "$__probe")"; done
            echo "- free disk: $(df -h "$__probe" | awk 'NR==2{print $4}') on $__probe"
            for c in git cmake ninja make gcc g++ python3 pip3 MicroXRCEAgent; do
              printf -- '- %s: %s\n' "$c" "$(command -v "$c" || echo MISSING)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report ROS and Python modules
        if: inputs.action == 'check'
        run: |
          set -uo pipefail
          if [ ! -f /opt/ros/jazzy/setup.bash ]; then
            echo "::error::/opt/ros/jazzy/setup.bash missing"
            exit 1
          fi
          set +u; . /opt/ros/jazzy/setup.bash; set -u
          echo "- ros2: $(command -v ros2 || echo MISSING)" >> "$GITHUB_STEP_SUMMARY"
          python3 -m pip --version >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          python3 - "$GITHUB_STEP_SUMMARY" <<'PY'
          import importlib.util as u, sys
          out = open(sys.argv[1], "a")
          for m in ("rclpy", "numpy", "yaml", "pymavlink", "scipy",
                    "vtkmodules", "gz.transport13", "gz.msgs10"):
              out.write(f"- py {m}: {'ok' if u.find_spec(m) else 'MISSING'}\n")
          out.close()
          PY
          cat "$GITHUB_STEP_SUMMARY" | tail -20

      - name: Install Python deps
        if: inputs.action == 'python-deps'
        run: |
          set -eo pipefail
          python3 -m pip install --user --break-system-packages pymavlink
          python3 -c "import pymavlink, pymavlink.dialects.v20.common as c; print('pymavlink OK', pymavlink.__file__)"

      - name: Clone PX4 (with submodules)
        if: inputs.action == 'clone-px4'
        run: |
          set -eo pipefail
          parent="$(dirname "$PX4_ROOT")"
          mkdir -p "$parent"   # runner 用户自己的目录，不需要 sudo
          if [ -d "$PX4_ROOT/.git" ]; then
            echo "already cloned at $PX4_ROOT"
            git -C "$PX4_ROOT" rev-parse HEAD
            git -C "$PX4_ROOT" log -1 --format='%h %s'
          else
            mkdir -p "$(dirname "$PX4_ROOT")"
            git clone --recursive "$PX4_REPO" "$PX4_ROOT"
          fi
          echo "--- uninitialized submodules (want 0) ---"
          git -C "$PX4_ROOT" submodule status | awk '$1 ~ /^-/ {print}' | tee /tmp/uninit.txt
          if [ -s /tmp/uninit.txt ]; then
            echo "::error::some submodules are not initialized; see the list above"
            exit 1
          fi
          du -sh "$PX4_ROOT"

      - name: Build SITL
        if: inputs.action == 'build-sitl'
        run: |
          set -eo pipefail
          cd "$PX4_ROOT"
          if [ ! -f Tools/setup/ubuntu.sh ]; then
            echo "::error::Tools/setup/ubuntu.sh missing; is PX4_ROOT correct?"
            exit 1
          fi
          if sudo -n true 2>/dev/null; then
            echo "--- installing PX4 build dependencies (sudo available) ---"
            sudo DEBIAN_FRONTEND=noninteractive bash Tools/setup/ubuntu.sh --no-nuttx 2>&1 | tail -20 \
              || sudo DEBIAN_FRONTEND=noninteractive bash Tools/setup/ubuntu.sh 2>&1 | tail -20
          else
            echo "::warning::no passwordless sudo; skipping Tools/setup/ubuntu.sh. If the build fails on a missing tool, install it manually on the runner."
          fi
          # Tools/setup/ubuntu.sh 被跳过时，PX4 的 Python 构建依赖需要单独装。
          # 这些是 pip 包，不需要 sudo。
          if [ -f Tools/setup/requirements.txt ]; then
            python3 -m pip install --user --break-system-packages -r Tools/setup/requirements.txt
          else
            python3 -m pip install --user --break-system-packages \
              kconfiglib jinja2 empy packaging toml numpy pyros-genmsg
          fi
          python3 -c "import kconfiglib, jinja2, empy; print('PX4 python build deps OK')"
          echo "--- building px4_sitl_default (parallel=$PARALLEL) ---"
          make px4_sitl_default -j"$PARALLEL" 2>&1 | tail -40
          ls -l build/px4_sitl_default/bin/px4
          echo "SITL binary built"
