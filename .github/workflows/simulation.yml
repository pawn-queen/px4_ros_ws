name: Simulation (self-hosted)

# 这条流水线只在有 PX4 树和 Gazebo 的专用机器上跑（runner: ubuntu-lab-sim）。
# 公开仓库 + 自托管 runner 是危险组合：外部 fork 的 PR 绝不允许触发这台机器。
# 因此这里有两道闸：
#   1) head.repo.full_name == github.repository —— fork PR 直接跳过
#   2) 只有被人工打上 run-sim 标签的 PR 才跑 —— 打标签需要 write 权限
# 只有维护者本人能同时满足这两条。详见 docs/CI_ARCHITECTURE.md。

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "SITL 场景"
        type: choice
        options: [default, room, powerplant]
        default: default
      timeout_s:
        description: "链路启动超时（秒）"
        default: "180"
      acceptance_scope:
        description: "powerplant 专用验收范围；首次使用 prepare"
        type: choice
        options: [prepare, scan, calibrate, mission]
        default: prepare
      frozen_profile:
        description: "powerplant mission 必填：本机此前生成的冻结控制配置路径"
        type: string
        default: ""
  pull_request:
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ubuntu-lab-sim-flight
  cancel-in-progress: false

jobs:
  guard:
    name: Simulation guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        run: |
          set -euo pipefail
          allowed=false
          reason=""
          if [ "${{ github.repository }}" != "pawn-queen/px4_ros_ws" ]; then
            reason="not the canonical repository"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.label.name }}" != "run-sim" ]; then
              reason="PR did not request the run-sim label"
            elif [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              reason="fork PR is never allowed on the self-hosted runner"
            else
              allowed=true
            fi
          else
            allowed=true
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "decision: allowed=$allowed ${reason:+($reason)}"
          {
            echo "### Simulation gate"
            echo ""
            echo "- event: \`${{ github.event_name }}\`"
            echo "- allowed: **$allowed**"
            if [ -n "$reason" ]; then echo "- reason: $reason"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  diagnose:
    name: Runner environment
    needs: guard
    if: needs.guard.outputs.allowed == 'true' && github.event.inputs.scenario != 'powerplant'
    runs-on: [self-hosted, sim-heavy]
    timeout-minutes: 10
    steps:
      - name: Report environment
        run: |
          set -uo pipefail
          {
            echo "### Runner environment"
            echo ""
            echo "- host: \`$(hostname)\`"
            echo "- kernel: \`$(uname -sr)\`"
            echo "- os: \`$(. /etc/os-release && echo "$PRETTY_NAME")\`"
            echo "- cpus: $(nproc)"
            echo "- ros_setup: $( [ -f /opt/ros/jazzy/setup.bash ] && echo present || echo MISSING )"
            root="${PX4_ROOT:-$HOME/drone-simulation}"
            echo "- px4_root: $root $( [ -d "$root" ] && echo present || echo MISSING )"
            echo "- px4_bin: $( [ -x "$root/build/px4_sitl_default/bin/px4" ] && echo present || echo MISSING )"
            for c in gz MicroXRCEAgent ros2 colcon git python3; do
              printf -- '- %s: %s\n' "$c" "$(command -v "$c" || echo MISSING)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
      - name: Report Python modules
        run: |
          set -uo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import importlib.util as u
          for m in ("rclpy", "numpy", "yaml", "pymavlink", "vtkmodules",
                    "gz.transport13", "gz.msgs10", "scipy"):
              print(f"- python {m}: {'ok' if u.find_spec(m) else 'MISSING'}")
          PY

  build:
    name: Build workspace
    needs: [guard, diagnose]
    if: needs.guard.outputs.allowed == 'true' && github.event.inputs.scenario != 'powerplant'
    runs-on: [self-hosted, sim-heavy]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: colcon build
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --packages-up-to px4_powerplant_mission_cpp px4_powerplant_mission \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=/usr/bin/python3

  smoke:
    name: Simulation chain smoke
    needs: [guard, build]
    if: needs.guard.outputs.allowed == 'true' && github.event.inputs.scenario != 'powerplant'
    runs-on: [self-hosted, sim-heavy]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 只建 px4_msgs：ros2 topic echo 需要它能解析 VehiclesStatus 之类的消息类型。
      # 不建的话 ros2 topic list -t 只会给出 [unknown type]，echo 必然失败。
      - name: Build px4_msgs for message types
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select px4_msgs \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=/usr/bin/python3

      - name: Run SITL smoke
        env:
          SCENARIO: ${{ github.event.inputs.scenario || 'default' }}
          TIMEOUT_S: ${{ github.event.inputs.timeout_s || '180' }}
          PX4_ROOT: ${{ vars.PX4_ROOT }}
        run: |
          set -euo pipefail
          px4_root="${PX4_ROOT:-$HOME/drone-simulation}"
          world="$px4_root/Tools/simulation/gz/worlds/default.sdf"
          if [ "$SCENARIO" = "room" ]; then
            world="$PWD/validation/sitl/worlds/room.sdf"
          fi
          echo "world=$world"
          WORKSPACE_SETUP="$PWD/install/setup.bash" \
            PX4_ROOT="$px4_root" PX4_WORLD="$world" \
            bash scripts/ci/sitl_smoke.sh "$TIMEOUT_S"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitl-smoke-logs
          path: log/ci_sitl_smoke/
          if-no-files-found: ignore
          retention-days: 7

  plant-acceptance:
    name: Actual powerplant acceptance
    needs: guard
    if: needs.guard.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'powerplant'
    runs-on: [self-hosted, Linux, X64, sim-heavy]
    timeout-minutes: 210
    env:
      PX4_ROOT: /home/gh-runner/drone-simulation
      ACCEPTANCE_SCOPE: ${{ inputs.acceptance_scope }}
      CONTROLLER_PROFILE: ${{ inputs.frozen_profile }}
      NATIVE_OUTPUT_ROOT: /home/gh-runner/.cache/px4_ros_ws/evidence/${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          # 复用构建产物；证据另存 checkout 外，避免后续 smoke 清理。
          clean: false

      - name: Build native ROS workspace
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --parallel-workers 4 \
            --packages-up-to px4_powerplant_mission_cpp px4_powerplant_mission \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=/usr/bin/python3

      - name: Run actual plant acceptance
        run: bash scripts/ci/issue3_acceptance.sh "$ACCEPTANCE_SCOPE"

      - name: Upload evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue3-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NATIVE_OUTPUT_ROOT }}/
          if-no-files-found: warn
          compression-level: 2
          retention-days: 14
