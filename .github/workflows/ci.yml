name: CI

# 只做三件事：Python 静态语法、纯逻辑单元测试、真实 ROS 2 构建 + C++ 测试。
# 仿真链路在 simulation.yml（self-hosted），理由见 docs/CI_ARCHITECTURE.md。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile all Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pyc
        run: |
          set -euo pipefail
          python3 --version
          python3 -m compileall -q src/px4_powerplant_mission/px4_powerplant_mission
          python3 -m compileall -q src/px4_powerplant_mission/test
          python3 -m compileall -q src/px4_powerplant_mission_cpp/test
          echo "compileall OK"

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy python3-pytest

      - name: Run pure-logic tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src/px4_powerplant_mission
        run: |
          set -euo pipefail
          python3 -m pytest -p no:cacheprovider -q \
            src/px4_powerplant_mission/test/test_core_math.py \
            src/px4_powerplant_mission/test/test_frontier_3d.py \
            src/px4_powerplant_mission/test/test_uwb_quality_solver.py

  package-metadata:
    name: ROS package metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate package.xml files and submodules
        run: |
          set -euo pipefail
          for d in src/px4_msgs src/px4_ros_com; do
            if [ ! -f "$d/package.xml" ]; then
              echo "::error::submodule $d is not populated; .gitmodules or the gitlink is broken"
              exit 1
            fi
          done
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          required = ("name", "version", "description", "maintainer", "license")
          errors = []
          pkgs = sorted(glob.glob("src/*/package.xml"))
          if not pkgs:
              sys.exit("no package.xml found under src/")

          for path in pkgs:
              root = ET.parse(path).getroot()
              name = (root.findtext("name") or "").strip()
              if not name:
                  errors.append(f"{path}: missing <name>")
                  continue
              if root.tag != "package":
                  errors.append(f"{path}: root element is <{root.tag}>, expected <package>")
              if not root.get("format"):
                  errors.append(f"{path}: <package> has no format attribute")
              for tag in required:
                  if not (root.findtext(tag) or "").strip():
                      errors.append(f"{path}: missing <{tag}>")
              print(f"ok  {name:<32} format={root.get('format')}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"{len(pkgs)} package.xml files OK")
          PY

  ros2-build-tests:
    name: ROS 2 build and C++ tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # PX4 的构建会用到 __DATE__ 之类的宏；不放开这两个，命中率会很低。
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: jazzy

      - name: rosdep install
        run: |
          # 不开 -u：/opt/ros/jazzy/setup.bash 会读未定义变量（AMENT_TRACE_SETUP_FILES）
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          sudo rosdep init 2>/dev/null || true
          rosdep update --rosdistro jazzy
          # 这些 key 在 Jazzy 的 rosdep 里缺失或会拖入不需要的东西，直接装对应的 apt 包：
          #   jsoncpp      -> libjsoncpp-dev（CMakeLists 用 find_package(jsoncpp)）
          #   eigen/libopencv-dev 同理
          #   ros_gz_bridge 只在仿真运行期需要，拉进来会多装一整套 Gazebo
          #   iceoryx_* 测试用的是默认 RMW
          sudo apt-get install -y libjsoncpp-dev libeigen3-dev libopencv-dev
          rosdep install -y --rosdistro jazzy --ignore-src \
            --from-paths src/px4_powerplant_mission src/px4_powerplant_mission_cpp src/px4_msgs \
            --skip-keys "ros_gz_bridge iceoryx_posh iceoryx_hoofs jsoncpp ament_python"

      - name: Resolve px4_msgs commit
        id: px4msgs
        run: |
          set -eo pipefail
          sha=$(git rev-parse HEAD:src/px4_msgs)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "px4_msgs gitlink: $sha"

      - name: Install ccache
        run: |
          set -eo pipefail
          sudo apt-get install -y --no-install-recommends ccache
          ccache --version | head -1
          ccache --max-size="$CCACHE_MAXSIZE" --show-stats

      - name: Cache ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          # 每个 commit 一个新 key，但 restore-keys 会把上一个 commit 的缓存
          # 捞回来做底子：只改一个文件时，其余目标文件全部命中。
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # px4_msgs 的构建占整个作业的一半以上（246 条消息的 rosidl 代码生成，
      # 不是编译器，所以 ccache 对它无效）。只缓存这一个包的 build/install，
      # 让 CMake 做增量：命中时 466s 会降到 ~20s。
      #
      # key 里带子模块的确切 commit，子模块一动就 miss；故意不写
      # restore-keys —— 宁可全量重编 8 分钟，也不接受"差不多能用"的旧缓存。
      - name: Cache px4_msgs build
        id: px4cache
        uses: actions/cache@v4
        with:
          path: |
            build/px4_msgs
            install/px4_msgs
          key: px4msgs-${{ steps.px4msgs.outputs.sha }}-jazzy-${{ runner.os }}

      - name: Build
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          echo "px4_msgs cache hit: ${{ steps.px4cache.outputs.cache-hit == 'true' }}"
          colcon build \
            --packages-up-to px4_powerplant_mission_cpp px4_powerplant_mission \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=/usr/bin/python3
          echo "--- ccache stats after build ---"
          ccache --show-stats

      - name: Run C++ tests (gtest only)
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          # ^test_ 只匹配 15 个 ament_add_gtest 目标；下面 9 个 ament_add_pytest_test
          # 依赖 gz / pymavlink / DDS 发现，留给 simulation.yml。
          colcon test \
            --packages-select px4_powerplant_mission_cpp \
            --executor sequential \
            --ctest-args -j1 -R "^test_" --output-on-failure
          colcon test-result --test-result-base build/px4_powerplant_mission_cpp --verbose
