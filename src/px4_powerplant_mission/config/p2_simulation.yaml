# PX4 navigation reference = x500_depth model origin for the retained SITL EV
# configuration. Sensor poses are from `gz sdf -p`, including the nested model.
# Physical base_link is +0.24m above this reference; body envelope includes it.
powerplant_voxel_mapper:
  ros__parameters:
    camera_translation_flu: [0.13233, 0.0, 0.26078]
    camera_rotation_rpy_rad: [0.0, 0.0, 0.0]
    lidar_translation_flu: [0.0, 0.0, 0.42]
    lidar_rotation_rpy_rad: [0.0, 0.0, 0.0]
powerplant_offboard_mission:
  ros__parameters:
    px4_timestamp_domain: ros
    motion_model_configured: true
    motion_rounded_envelope_enabled: true
    # A consistent micro-ascent spans the current PX4 spool + takeoff ramp.
    # The SITL harness verifies these against actual read-only PX4 parameters.
    motion_takeoff_bootstrap_height_m: 0.02
    motion_takeoff_bootstrap_duration_s: 4.5
    motion_tracking_position_tolerance_m: 0.10
    motion_tracking_soft_guard_enabled: true
    # Enabled only in the runner's derived motion profile after the actual
    # world/body support audit. Ordinary launch remains usable in strict IDLE.
    takeoff_response_sync_enabled: false
    takeoff_transition_budget_enabled: false
    motion_body_radius_m: 0.5
    # Analytic collision-box / complete rotor-yaw bound at total tilt <= .35:
    # z >= -.05201654m. Keep ~8mm additional geometric margin here; map and
    # navigation uncertainty margins remain separate and unchanged.
    motion_body_z_min_m: -0.06
    motion_body_z_max_m: 0.5
    camera_translation_flu: [0.13233, 0.0, 0.26078]
    camera_rotation_rpy_rad: [0.0, 0.0, 0.0]
    rgb_camera_translation_flu: [0.13233, 0.0, 0.26078]
    rgb_camera_rotation_rpy_rad: [0.0, 0.0, 0.0]
